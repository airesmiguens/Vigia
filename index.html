<title>Vigia</title>
<style>
  :root {
    color-scheme: light;
    --bg: #F4F5F3;
    --surface: #FCFCFB;
    --surface-2: #ECEEEA;
    --border: rgba(10,20,18,0.11);
    --border-strong: rgba(10,20,18,0.20);
    --text-primary: #10201C;
    --text-secondary: #4B5850;
    --text-muted: #7C877F;
    --accent: #4a3aa7;
    --accent-soft: rgba(74,58,167,0.10);
    --accent-text: #4a3aa7;
    --good: #0ca30c;
    --warning: #b8790a;
    --warning-dot: #fab219;
    --critical: #d03b3b;
    --cat-1: #2a78d6;
    --cat-2: #eb6834;
    --cat-3: #1baf7a;
    --cat-4: #eda100;
    --cat-5: #e87ba4;
    --shadow-card: 0 1px 2px rgba(10,20,18,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0F1513;
      --surface: #1A1A19;
      --surface-2: #212926;
      --border: rgba(243,245,242,0.10);
      --border-strong: rgba(243,245,242,0.20);
      --text-primary: #F3F5F2;
      --text-secondary: #C3C2B7;
      --text-muted: #8A9089;
      --accent: #9085e9;
      --accent-soft: rgba(144,133,233,0.16);
      --accent-text: #b3abf0;
      --good: #2fce2f;
      --warning: #fab219;
      --warning-dot: #fab219;
      --critical: #e66767;
      --cat-1: #3987e5;
      --cat-2: #d95926;
      --cat-3: #199e70;
      --cat-4: #c98500;
      --cat-5: #d55181;
      --shadow-card: 0 1px 2px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0F1513;
    --surface: #1A1A19;
    --surface-2: #212926;
    --border: rgba(243,245,242,0.10);
    --border-strong: rgba(243,245,242,0.20);
    --text-primary: #F3F5F2;
    --text-secondary: #C3C2B7;
    --text-muted: #8A9089;
    --accent: #9085e9;
    --accent-soft: rgba(144,133,233,0.16);
    --accent-text: #b3abf0;
    --good: #2fce2f;
    --warning: #fab219;
    --warning-dot: #fab219;
    --critical: #e66767;
    --cat-1: #3987e5;
    --cat-2: #d95926;
    --cat-3: #199e70;
    --cat-4: #c98500;
    --cat-5: #d55181;
    --shadow-card: 0 1px 2px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .mono {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  a { color: var(--accent-text); }

  .app {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 24px 64px;
  }

  /* ---------- Masthead ---------- */
  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    flex-wrap: wrap;
    padding: 36px 0 22px;
    border-bottom: 1px solid var(--border-strong);
    margin-bottom: 28px;
  }
  .prepared-for {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 18px;
  }
  .prepared-for__label {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .prepared-for__logo { height: 34px; width: auto; display: block; }

  .masthead__eyebrow {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 10px;
  }
  .masthead__title {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-size: clamp(2.4rem, 6vw, 3.4rem);
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }
  .masthead__sub {
    margin: 10px 0 0;
    max-width: 46ch;
    color: var(--text-secondary);
    font-size: 0.95rem;
  }
  .masthead__meta {
    text-align: right;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    color: var(--text-secondary);
    font-size: 0.8125rem;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }
  .masthead__clock {
    font-size: 1.1rem;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }
  .masthead__meta .dim { color: var(--text-muted); }

  .lang-toggle {
    display: inline-flex;
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    overflow: hidden;
  }
  .lang-btn {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    background: var(--surface);
    color: var(--text-secondary);
    border: none;
    padding: 5px 11px;
    cursor: pointer;
  }
  .lang-btn + .lang-btn { border-left: 1px solid var(--border-strong); }
  .lang-btn[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
  .lang-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* ---------- Document links ---------- */
  .doc-links { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .doc-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em;
    padding: 6px 11px; border-radius: 7px; text-decoration: none;
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-primary);
  }
  .doc-btn:hover { border-color: var(--accent); color: var(--accent-text); }
  .doc-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .doc-btn svg { width: 14px; height: 14px; flex: none; }
  .doc-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 8px; }
  .doc-card {
    display: flex; flex-direction: column; gap: 6px; padding: 16px;
    border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface);
    text-decoration: none; color: var(--text-primary);
  }
  .doc-card:hover { border-color: var(--accent); }
  .doc-card__type { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-text); font-weight: 700; }
  .doc-card h4 { margin: 0; font-size: 1rem; }
  .doc-card p { margin: 0; color: var(--text-secondary); font-size: 0.875rem; }
  .doc-card__cta { margin-top: auto; padding-top: 6px; font-size: 0.85rem; font-weight: 600; color: var(--accent-text); }
  @media (max-width: 640px) { .doc-links { justify-content: flex-start; } }

  /* ---------- Section labels ---------- */
  .section-label {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 0 0 16px;
    flex-wrap: wrap;
  }
  .section-label__num {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-size: 0.75rem;
    color: var(--text-muted);
    letter-spacing: 0.08em;
  }
  .section-label h2 {
    font-size: 1.05rem;
    margin: 0;
    font-weight: 700;
  }
  .section-label__note {
    margin-left: auto;
    font-size: 0.75rem;
    color: var(--text-muted);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  section.block { margin-bottom: 46px; }

  /* ---------- KPI strip ---------- */
  .kpi-strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .kpi-tile {
    background: var(--surface);
    padding: 18px 20px;
  }
  .kpi-tile__value {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-size: 2rem;
    font-weight: 600;
    color: var(--accent-text);
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .kpi-tile__label {
    margin-top: 6px;
    font-size: 0.8125rem;
    color: var(--text-secondary);
    max-width: 26ch;
  }
  .sources-line {
    margin-top: 10px;
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  /* ---------- Market panel ---------- */
  .market-panel {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 32px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
  }
  .donut-wrap { display: flex; justify-content: center; }
  .legend-table { width: 100%; border-collapse: collapse; }
  .legend-table td { padding: 7px 6px; font-size: 0.85rem; border-bottom: 1px solid var(--border); }
  .legend-table tr:last-child td { border-bottom: none; }
  .legend-swatch { display:inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 8px; vertical-align: -1px; }
  .legend-name { color: var(--text-primary); }
  .legend-share { text-align: right; font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .legend-stations { text-align: right; color: var(--text-muted); font-size: 0.78rem; font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace; }

  @media (max-width: 640px) {
    .market-panel { grid-template-columns: 1fr; }
  }

  /* ---------- Simulation banner ---------- */
  .sim-banner {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    background: var(--accent-soft);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 22px;
  }
  .sim-banner__badge {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    background: var(--accent);
    color: var(--surface);
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
    margin-top: 2px;
  }
  .sim-banner p { margin: 0; font-size: 0.85rem; color: var(--text-secondary); }
  .sim-banner strong { color: var(--text-primary); }

  /* ---------- Filter bar ---------- */
  .filter-bar {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 18px;
  }
  .filter-field { display: flex; align-items: center; gap: 8px; }
  .filter-field label {
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
  }
  .filter-field select {
    appearance: none;
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    color: var(--text-primary);
    font: inherit;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-size: 0.82rem;
    padding: 6px 28px 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 14px) center, calc(100% - 9px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    color: var(--text-primary);
  }
  .filter-field select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .filter-count {
    margin-left: auto;
    font-size: 0.76rem;
    color: var(--text-muted);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
  }

  /* ---------- Network grid ---------- */
  .network-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
  }
  .station-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    box-shadow: var(--shadow-card);
  }
  .station-card__head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2px;
  }
  .station-code {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-size: 0.78rem;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }
  .station-card__location { font-size: 0.9rem; font-weight: 600; margin-bottom: 12px; }
  .station-card__location .dim { font-weight: 400; color: var(--text-muted); font-size: 0.8rem; }

  .station-card__body { display: flex; gap: 16px; }

  .tank { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: none; }
  .tank__tube {
    position: relative;
    width: 30px;
    height: 108px;
    border-radius: 15px;
    border: 2px solid var(--border-strong);
    background: var(--surface-2);
    overflow: hidden;
  }
  .tank__fill {
    position: absolute;
    left: -2px; right: -2px; bottom: -2px;
    border-radius: 13px;
    height: 0%;
  }
  .tank__fill::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: rgba(255,255,255,0.35);
  }
  @media (prefers-reduced-motion: no-preference) {
    .tank__fill { transition: height 0.9s ease, background-color 0.4s ease; }
  }
  .tank__mark {
    position: absolute;
    left: 3px; right: 3px;
    bottom: 50%;
    border-top: 1px dashed var(--border-strong);
    height: 0;
  }
  .tank__value {
    font-size: 0.92rem;
    font-weight: 600;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 4px 8px 4px 6px;
    border-radius: 20px;
    border: 1px solid var(--border);
    flex: none;
  }
  .status-pill__dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .status-pill--good { color: var(--good); background: color-mix(in srgb, var(--good) 10%, transparent); }
  .status-pill--good .status-pill__dot { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 18%, transparent); }
  .status-pill--warning { color: var(--warning); background: color-mix(in srgb, var(--warning-dot) 14%, transparent); }
  .status-pill--warning .status-pill__dot { background: var(--warning-dot); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warning-dot) 20%, transparent); }
  .status-pill--critical { color: var(--critical); background: color-mix(in srgb, var(--critical) 12%, transparent); }
  .status-pill--critical .status-pill__dot { background: var(--critical); box-shadow: 0 0 0 3px color-mix(in srgb, var(--critical) 20%, transparent); }

  .station-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; margin: 0; font-size: 0.76rem; align-content: start; flex: 1; }
  .station-stats dt { color: var(--text-muted); margin: 0 0 2px; }
  .station-stats dd { margin: 0; font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; color: var(--text-primary); font-size: 0.82rem; }

  .no-results { padding: 30px; text-align: center; color: var(--text-muted); border: 1px dashed var(--border-strong); border-radius: 10px; grid-column: 1 / -1; font-size: 0.85rem; }

  /* ---------- Priority queue ---------- */
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  table.priority { width: 100%; border-collapse: collapse; min-width: 640px; }
  table.priority th {
    text-align: left;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
    font-weight: 600;
  }
  table.priority td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
  }
  table.priority tr:last-child td { border-bottom: none; }
  table.priority td.num { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .rank { color: var(--text-muted); font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace; }
  .action-badge {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 4px 8px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .action-badge--dispatch { background: color-mix(in srgb, var(--critical) 14%, transparent); color: var(--critical); }
  .action-badge--schedule { background: color-mix(in srgb, var(--warning-dot) 16%, transparent); color: var(--warning); }
  .action-badge--monitor { background: color-mix(in srgb, var(--good) 12%, transparent); color: var(--good); }

  /* ---------- How it works ---------- */
  .how-flow {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  .how-step {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 3px solid var(--accent);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .how-step__kicker {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent-text);
    margin-bottom: 4px;
  }
  .how-step h3 { margin: 0 0 8px; font-size: 0.98rem; }
  .how-step p { margin: 0; font-size: 0.82rem; color: var(--text-secondary); }
  .how-step p strong { color: var(--text-primary); }
  .faq-title { font-size: 0.95rem; margin: 28px 0 12px; }
  .faq-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .faq-item { background: var(--surface); padding: 14px 18px; }
  .faq-item h4 { margin: 0 0 6px; font-size: 0.86rem; }
  .faq-item p { margin: 0; font-size: 0.8rem; color: var(--text-secondary); }

  /* ---------- Pitch panel ---------- */
  .pitch-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 28px;
  }
  .pitch-panel h3 { margin: 0 0 10px; font-size: 1.05rem; }
  .pitch-panel p { color: var(--text-secondary); margin: 0 0 12px; max-width: 68ch; }
  .pitch-panel ul { margin: 0; padding-left: 1.1em; color: var(--text-secondary); }
  .pitch-panel li { margin-bottom: 6px; }

  /* ---------- Footer / signature ---------- */
  .signoff {
    margin-top: 54px;
    padding-top: 24px;
    border-top: 1px solid var(--border-strong);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 24px;
    font-size: 0.82rem;
    color: var(--text-secondary);
  }
  .signoff__name { color: var(--text-primary); font-weight: 700; font-size: 0.95rem; }
  .signoff__cred { margin-top: 4px; line-height: 1.6; max-width: 44ch; }
  .signoff__contact { text-align: right; font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace; font-size: 0.78rem; line-height: 1.9; }
  .signoff__contact a { color: var(--text-secondary); text-decoration: none; }
  .signoff__contact a:hover { color: var(--accent-text); }
  .disclaimer {
    margin-top: 20px;
    font-size: 0.72rem;
    color: var(--text-muted);
    max-width: 80ch;
  }
</style>

<div class="app">

  <header class="masthead">
    <div>
      <div class="prepared-for">
        <span class="prepared-for__label" data-i18n="preparedFor"></span>
        <picture>
          <source srcset="assets/sonangol_white.png" media="(prefers-color-scheme: dark)">
          <img class="prepared-for__logo" src="assets/sonangol_dark.png" alt="Sonangol">
        </picture>
      </div>

      howTitle: "How it works: from the tank probe to the dashboard",
      howNote: "Read-only · Never touches the pumps",
      how1Kicker: "1 · In the tank",
      how1Title: "Level probe",
      how1Text: "Most modern stations already have an <strong>automatic tank gauge</strong> (ATG): probes in each tank wired to a console in the office (e.g. Veeder-Root, Franklin Fueling, OPW/Fafnir). They measure fuel level, water at the bottom and temperature. Vigia builds on what is already there.",
      how2Kicker: "2 · In the office",
      how2Title: "Communication gateway",
      how2Text: "A small industrial box connects to the console's serial (RS-232) or network port and requests the inventory every 5–15 minutes — <strong>read-only</strong>. It has a battery for power cuts and stores readings when the network drops.",
      how3Kicker: "3 · Over the network",
      how3Title: "Secure transmission",
      how3Text: "Over <strong>4G/3G mobile network</strong> with a SIM card (Unitel, Africell or Movicel), or the station's existing internet. The connection is encrypted; each reading is a few KB, so data cost is very low.",
      how4Kicker: "4 · On the server",
      how4Title: "Vigia",
      how4Text: "On a Sonangol server or a cloud of Sonangol's choice. It converts level to litres using each tank's calibration chart, calculates draw-down and stockout forecasts, feeds this dashboard and sends <strong>SMS/email alerts</strong> to dispatchers.",
      faqTitle: "Frequently asked questions",
      faq1Q: "What if a station has no automatic gauge?",
      faq1A: "The week 1–2 survey identifies these stations. A probe or a non-contact radar sensor is fitted on top of the tank, certified for explosive atmospheres (ATEX/IECEx) and installed by an accredited technician. In the meantime, manual dipstick readings can be logged in an app.",
      faq2Q: "What if the mobile network fails?",
      faq2A: "The gateway stores readings and sends them when the network returns, with no data lost. An external antenna fixes weak signal; areas with no coverage use a satellite link.",
      faq3Q: "Can the system touch the pumps or prices?",
      faq3A: "No. The gateway only reads tank inventory. It has no access to the pumps, the point-of-sale system or payments.",
      faq4Q: "Who controls the data?",
      faq4A: "Sonangol. Encrypted connections, each gateway with its own certificate, hosting wherever Sonangol decides, and role-based access (station, region, head office).",
      faq5Q: "What about power cuts?",
      faq5A: "The gateway has its own battery and keeps measuring. Many ATG consoles are also on the station's UPS.",
      faq6Q: "Beyond stockouts, what else is gained?",
      faq6A: "Comparing the drop in tank level with sales recorded at the pumps detects leaks and stock discrepancies — and confirms each delivery unloaded the volume invoiced.",
      signoffCred: "Data Scientist · MSc Data Science, Worcester Polytechnic Institute (exp. 2026) · Fulbright Scholar 2024–2026 · IEEE HealthCom 2026 (peer-reviewed) · Harvard Health System Innovation Lab, Research Collaborator",
      disclaimer: 'Vigia is an independent prototype prepared by Aires Miguêns for presentation to Sonangol Distribuidora. It is not affiliated with or endorsed by Sonangol, and was not built using Sonangol data. Figures in sections 01–02 come from public sources (ANGOP, IRDP, S&amp;P Global, trade press); station data in sections 03–04 is synthetic and illustrative only.',
      marketNames: ["Sonangol Distribuidora", "Bandeira Branca (independents)", "Pumangol", "Sonangalp (Galp)", "Tomsa (TotalEnergies)"]
    }
  };
  var currentLang = "pt";
  function t(key) { return i18n[currentLang][key]; }

  // ---------- clock ----------
  var clockEl = document.getElementById("clock");
  var clockDateEl = document.getElementById("clockDate");
  function tickClock() {
    var now = new Date();
    var locale = currentLang === "pt" ? "pt-PT" : "en-GB";
    var timeFmt = new Intl.DateTimeFormat(locale, { hour: "2-digit", minute: "2-digit", second: "2-digit", timeZone: "Africa/Luanda", hour12: false });
    var dateFmt = new Intl.DateTimeFormat(locale, { day: "2-digit", month: "short", year: "numeric", timeZone: "Africa/Luanda" });
    clockEl.textContent = timeFmt.format(now);
    clockDateEl.textContent = "Luanda · " + dateFmt.format(now);
  }
  tickClock();
  setInterval(tickClock, 1000);

  // ---------- market share (real, sourced) ----------
  var marketBase = [
    { share: 36, stations: 326, color: "var(--accent)" },
    { share: 44, stations: 393, color: "color-mix(in srgb, var(--text-muted) 55%, transparent)" },
    { share: 9, stations: 78, color: "color-mix(in srgb, var(--text-muted) 40%, transparent)" },
    { share: 7, stations: 60, color: "color-mix(in srgb, var(--text-muted) 30%, transparent)" },
    { share: 4, stations: 41, color: "color-mix(in srgb, var(--text-muted) 20%, transparent)" }
  ];
  var donutSvg = document.getElementById("donut");
  var legendTableEl = document.getElementById("legendTable");
  var ns = "http://www.w3.org/2000/svg";

  function renderDonut() {
    donutSvg.innerHTML = "";
    var cx = 90, cy = 90, r = 68, sw = 24;
    var circumference = 2 * Math.PI * r;
    var offset = 0;
    var names = t("marketNames");
    marketBase.forEach(function (m, idx) {
      var len = (m.share / 100) * circumference;
      var gap = 2;
      var circle = document.createElementNS(ns, "circle");
      circle.setAttribute("cx", cx);
      circle.setAttribute("cy", cy);
      circle.setAttribute("r", r);
      circle.setAttribute("fill", "none");
      circle.style.stroke = m.color;
      circle.setAttribute("stroke-width", sw);
      circle.setAttribute("stroke-dasharray", Math.max(len - gap, 1) + " " + (circumference - len + gap));
      circle.setAttribute("stroke-dashoffset", -offset);
      circle.setAttribute("transform", "rotate(-90 " + cx + " " + cy + ")");
      var title = document.createElementNS(ns, "title");
      title.textContent = names[idx] + " — " + m.share + "% (" + m.stations + (currentLang === "pt" ? " postos)" : " stations)");
      circle.appendChild(title);
      donutSvg.appendChild(circle);
      offset += len;
    });
    var centerText = document.createElementNS(ns, "text");
    centerText.setAttribute("x", cx);
    centerText.setAttribute("y", cy - 4);
    centerText.setAttribute("text-anchor", "middle");
    centerText.setAttribute("class", "mono");
    centerText.setAttribute("font-size", "22");
    centerText.setAttribute("font-weight", "600");
    centerText.setAttribute("fill", "currentColor");
    centerText.textContent = marketBase[0].share + "%";
    donutSvg.appendChild(centerText);
    var centerSub = document.createElementNS(ns, "text");
    centerSub.setAttribute("x", cx);
    centerSub.setAttribute("y", cy + 14);
    centerSub.setAttribute("text-anchor", "middle");
    centerSub.setAttribute("font-size", "10");
    centerSub.setAttribute("fill", "currentColor");
    centerSub.setAttribute("opacity", "0.55");
    centerSub.textContent = t("donutCenter");
    donutSvg.appendChild(centerSub);
  }

  function renderLegend() {
    legendTableEl.innerHTML = "";
    var names = t("marketNames");
    marketBase.forEach(function (m, idx) {
      var tr = document.createElement("tr");
      tr.innerHTML =
        '<td><span class="legend-swatch" style="background:' + m.color + '"></span><span class="legend-name">' + names[idx] + '</span></td>' +
        '<td class="legend-share">' + m.share + '%</td>' +
        '<td class="legend-stations">' + m.stations + ' ' + t("donutStations") + '</td>';
      legendTableEl.appendChild(tr);
    });
  }

  // ---------- simulated station network (real provinces/municípios) ----------
  var geography = {
    "Luanda": ["Kilamba Kiaxi", "Talatona", "Viana", "Ingombota", "Maianga", "Cazenga", "Rangel", "Cacuaco", "Belas", "Sambizanga"],
    "Benguela": ["Benguela", "Lobito", "Baía Farta", "Catumbela"],
    "Huíla": ["Lubango", "Matala", "Humpata"],
    "Huambo": ["Huambo", "Caála", "Bailundo"],
    "Cabinda": ["Cabinda", "Cacongo"]
  };

  var stations = [];
  Object.keys(geography).forEach(function (province) {
    geography[province].forEach(function (municipio) {
      var idx = stations.length;
      var capacity = Math.round((22000 + rng() * 20000) / 500) * 500;
      var pct = 0.08 + rng() * 0.9;
      var rate = Math.round(280 + rng() * 620);
      stations.push({
        code: "PST-" + String(idx + 1).padStart(2, "0"),
        province: province,
        district: municipio,
        capacity: capacity,
        level: capacity * pct,
        rate: rate
      });
    });
  });
  function forceState(district, pctOfCap, rate) {
    var s = stations.find(function (x) { return x.district === district; });
    if (s) { s.level = s.capacity * pctOfCap; if (rate) s.rate = rate; }
  }
  forceState("Viana", 0.09, 540);
  forceState("Cazenga", 0.03, 668);
  forceState("Rangel", 0.30);
  forceState("Cacuaco", 0.35);
  forceState("Sambizanga", 0.20);
  forceState("Lobito", 0.07, 610);
  forceState("Matala", 0.28);
  forceState("Caála", 0.11, 470);

  var gridEl = document.getElementById("networkGrid");
  var priorityBody = document.getElementById("priorityBody");
  var provinceSelect = document.getElementById("provinceSelect");
  var municipioSelect = document.getElementById("municipioSelect");
  var filterCountEl = document.getElementById("filterCount");

  function populateProvinces() {
    var current = provinceSelect.value || "all";
    var opts = ['<option value="all">' + t("filterAllProvinces") + '</option>'];
    Object.keys(geography).forEach(function (p) {
      opts.push('<option value="' + p + '">' + p + '</option>');
    });
    provinceSelect.innerHTML = opts.join("");
    provinceSelect.value = current;
    if (provinceSelect.selectedIndex < 0) provinceSelect.value = "all";
  }
  function populateMunicipios(province) {
    var current = municipioSelect.value || "all";
    var opts = ['<option value="all">' + t("filterAllMunicipios") + '</option>'];
    var list = province === "all"
      ? Object.keys(geography).reduce(function (acc, p) { return acc.concat(geography[p]); }, [])
      : geography[province] || [];
    list.forEach(function (m) { opts.push('<option value="' + m + '">' + m + '</option>'); });
    municipioSelect.innerHTML = opts.join("");
    municipioSelect.value = current;
    if (municipioSelect.selectedIndex < 0) municipioSelect.value = "all";
  }

  function currentFilter() {
    return { province: provinceSelect.value, municipio: municipioSelect.value };
  }
  function filteredStations() {
    var f = currentFilter();
    return stations.filter(function (s) {
      return (f.province === "all" || s.province === f.province) &&
             (f.municipio === "all" || s.district === f.municipio);
    });
  }

  function statusFor(pct) {
    if (pct <= 0.15) return { key: "critical", label: t("statusCritical") };
    if (pct <= 0.4) return { key: "warning", label: t("statusLow") };
    return { key: "good", label: t("statusReady") };
  }
  function hoursToEmpty(s) {
    return s.rate > 0 ? s.level / s.rate : 999;
  }
  function riskPct(hrs) {
    return Math.max(3, Math.min(97, Math.round(100 - (hrs / 30) * 100)));
  }
  function fmtEta(hrs) {
    return hrs > 96 ? t("etaPlus") : t("etaPrefix") + Math.round(hrs) + "h";
  }

  function buildCard(s) {
    var i = stations.indexOf(s);
    var card = document.createElement("article");
    card.className = "station-card";

    var head = document.createElement("div");
    head.className = "station-card__head";
    head.innerHTML = '<span class="station-code">' + s.code + '</span>' +
      '<span class="status-pill" id="pill-' + i + '"><span class="status-pill__dot"></span><span class="status-pill__label"></span></span>';
    card.appendChild(head);

    var loc = document.createElement("div");
    loc.className = "station-card__location";
    loc.innerHTML = s.district + ' <span class="dim">· ' + s.province + '</span>';
    card.appendChild(loc);

    var body = document.createElement("div");
    body.className = "station-card__body";
    body.innerHTML =
      '<div class="tank">' +
        '<div class="tank__tube"><div class="tank__mark"></div><div class="tank__fill" id="fill-' + i + '"></div></div>' +
        '<div class="tank__value mono" id="val-' + i + '">0%</div>' +
      '</div>' +
      '<dl class="station-stats">' +
        '<div><dt>' + t("statVolume") + '</dt><dd id="vol-' + i + '"></dd></div>' +
        '<div><dt>' + t("statDrawdown") + '</dt><dd>' + s.rate.toLocaleString() + ' L/h</dd></div>' +
        '<div><dt>' + t("statEta") + '</dt><dd id="eta-' + i + '"></dd></div>' +
        '<div><dt>' + t("statRisk") + '</dt><dd id="risk-' + i + '"></dd></div>' +
      '</dl>';
    card.appendChild(body);
    return card;
  }

  function renderGrid() {
    var visible = filteredStations();
    gridEl.innerHTML = "";
    if (!visible.length) {
      var empty = document.createElement("div");
      empty.className = "no-results";
      empty.textContent = t("noResults");
      gridEl.appendChild(empty);
    } else {
      visible.forEach(function (s) { gridEl.appendChild(buildCard(s)); });
    }
    filterCountEl.textContent = t("filterCount")(visible.length, stations.length);
    updateValues();
  }

  function updateValues() {
    stations.forEach(function (s, i) {
      var fillEl = document.getElementById("fill-" + i);
      if (!fillEl) return; // not currently rendered (filtered out)
      var pct = Math.max(0, Math.min(1, s.level / s.capacity));
      var st = statusFor(pct);
      var color = st.key === "good" ? "var(--good)" : st.key === "warning" ? "var(--warning-dot)" : "var(--critical)";
      fillEl.style.height = (pct * 100).toFixed(1) + "%";
      fillEl.style.background = color;

      document.getElementById("val-" + i).textContent = Math.round(pct * 100) + "%";

      var pill = document.getElementById("pill-" + i);
      pill.className = "status-pill status-pill--" + st.key;
      pill.querySelector(".status-pill__label").textContent = st.label;

      document.getElementById("vol-" + i).textContent = Math.round(s.level).toLocaleString() + " L";
      var hrs = hoursToEmpty(s);
      document.getElementById("eta-" + i).textContent = fmtEta(hrs);
      document.getElementById("risk-" + i).textContent = riskPct(hrs) + "%";
    });
    renderPriority();
    renderRiskSummary();
  }

  // ---------- revenue at risk (simulated stations, diesel at Kz 400/L) ----------
  var pricePerLitreKz = 400;
  function renderRiskSummary() {
    var visible = filteredStations();
    var critical = 0, atRisk = 0, litres = 0;
    visible.forEach(function (s) {
      var hrs = hoursToEmpty(s);
      if (statusFor(s.level / s.capacity).key === "critical") critical++;
      if (hrs < 24) { atRisk++; litres += (24 - hrs) * s.rate; }
    });
    var locale = currentLang === "pt" ? "pt-PT" : "en-GB";
    var kz = litres * pricePerLitreKz;
    document.getElementById("riskCriticalVal").textContent = critical;
    document.getElementById("riskAtRiskVal").textContent = atRisk;
    document.getElementById("riskLitresVal").textContent = Math.round(litres).toLocaleString(locale) + " L";
    document.getElementById("riskKzVal").textContent = "Kz " + (kz / 1e6).toLocaleString(locale, { maximumFractionDigits: 1 }) + " M";
  }

  function renderPriority() {
    var ranked = filteredStations().map(function (s) { return { s: s, hrs: hoursToEmpty(s) }; })
      .sort(function (a, b) { return a.hrs - b.hrs; })
      .slice(0, 6);
    priorityBody.innerHTML = "";
    if (!ranked.length) {
      priorityBody.innerHTML = '<tr><td colspan="6" class="no-results" style="border:none;">' + t("noResults") + '</td></tr>';
      return;
    }
    ranked.forEach(function (r, idx) {
      var action = r.hrs < 4 ? { cls: "dispatch", label: t("actionDispatch") } : r.hrs < 12 ? { cls: "schedule", label: t("actionSchedule") } : { cls: "monitor", label: t("actionMonitor") };
      var tr = document.createElement("tr");
      tr.innerHTML =
        '<td class="rank">' + (idx + 1) + '</td>' +
        '<td>' + r.s.code + '</td>' +
        '<td>' + r.s.district + '</td>' +
        '<td class="num">' + fmtEta(r.hrs) + '</td>' +
        '<td class="num">' + riskPct(r.hrs) + '%</td>' +
        '<td><span class="action-badge action-badge--' + action.cls + '">' + action.label + '</span></td>';
      priorityBody.appendChild(tr);
    });
  }

  // ---------- static text application ----------
  function applyStaticText() {
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var key = el.getAttribute("data-i18n");
      el.textContent = t(key);
    });
    document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
      el.innerHTML = t(el.getAttribute("data-i18n-html"));
    });
    document.getElementById("sourcesLine").innerHTML = t("sourcesLine");
    document.getElementById("simText").innerHTML = t("simText");
    document.getElementById("pitchP1").textContent = t("pitchP1");
    ["pitchLi1", "pitchLi2", "pitchLi3", "pitchLi4", "pitchLi5", "pitchLi6"].forEach(function (id) {
      document.getElementById(id).innerHTML = t(id);
    });
    document.getElementById("signoffCred").textContent = t("signoffCred");
    document.getElementById("disclaimer").innerHTML = t("disclaimer");
    document.documentElement.lang = currentLang;
  }

  function setLang(lang) {
    currentLang = lang;
    document.getElementById("langPt").setAttribute("aria-pressed", lang === "pt" ? "true" : "false");
    document.getElementById("langEn").setAttribute("aria-pressed", lang === "en" ? "true" : "false");
    applyStaticText();
    populateProvinces();
    populateMunicipios(provinceSelect.value);
    renderDonut();
    renderLegend();
    renderGrid();
    tickClock();
  }

  document.getElementById("langPt").addEventListener("click", function () { setLang("pt"); });
  document.getElementById("langEn").addEventListener("click", function () { setLang("en"); });

  provinceSelect.addEventListener("change", function () {
    populateMunicipios(provinceSelect.value);
    renderGrid();
  });
  municipioSelect.addEventListener("change", renderGrid);

  setLang("pt");

  var tickMs = reduceMotion ? 4000 : 1800;
  setInterval(function () {
    stations.forEach(function (s) {
      var jitter = 0.6 + rng() * 0.8;
      s.level -= (s.rate / 3600) * (tickMs / 1000) * 90 * jitter;
      if (s.level <= 0) {
        s.level = s.capacity; // simulated resupply
      }
    });
    updateValues();
  }, tickMs);
})();
</script>
