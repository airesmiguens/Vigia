<title>Vigia</title>
<style>
  :root {
    color-scheme: light;
    --bg: #F4F5F3;
    --surface: #FCFCFB;
    --surface-2: #ECEEEA;
    --border: rgba(10,20,18,0.11);
    --border-strong: rgba(10,20,18,0.20);
    --text-primary: #10201C;
    --text-secondary: #4B5850;
    --text-muted: #7C877F;
    --accent: #4a3aa7;
    --accent-soft: rgba(74,58,167,0.10);
    --accent-text: #4a3aa7;
    --good: #0ca30c;
    --warning: #b8790a;
    --warning-dot: #fab219;
    --critical: #d03b3b;
    --cat-1: #2a78d6;
    --cat-2: #eb6834;
    --cat-3: #1baf7a;
    --cat-4: #eda100;
    --cat-5: #e87ba4;
    --shadow-card: 0 1px 2px rgba(10,20,18,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0F1513;
      --surface: #1A1A19;
      --surface-2: #212926;
      --border: rgba(243,245,242,0.10);
      --border-strong: rgba(243,245,242,0.20);
      --text-primary: #F3F5F2;
      --text-secondary: #C3C2B7;
      --text-muted: #8A9089;
      --accent: #9085e9;
      --accent-soft: rgba(144,133,233,0.16);
      --accent-text: #b3abf0;
      --good: #2fce2f;
      --warning: #fab219;
      --warning-dot: #fab219;
      --critical: #e66767;
      --cat-1: #3987e5;
      --cat-2: #d95926;
      --cat-3: #199e70;
      --cat-4: #c98500;
      --cat-5: #d55181;
      --shadow-card: 0 1px 2px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0F1513;
    --surface: #1A1A19;
    --surface-2: #212926;
    --border: rgba(243,245,242,0.10);
    --border-strong: rgba(243,245,242,0.20);
    --text-primary: #F3F5F2;
    --text-secondary: #C3C2B7;
    --text-muted: #8A9089;
    --accent: #9085e9;
    --accent-soft: rgba(144,133,233,0.16);
    --accent-text: #b3abf0;
    --good: #2fce2f;
    --warning: #fab219;
    --warning-dot: #fab219;
    --critical: #e66767;
    --cat-1: #3987e5;
    --cat-2: #d95926;
    --cat-3: #199e70;
    --cat-4: #c98500;
    --cat-5: #d55181;
    --shadow-card: 0 1px 2px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .mono {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  a { color: var(--accent-text); }

  .app {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 24px 64px;
  }

  /* ---------- Masthead ---------- */
  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    flex-wrap: wrap;
    padding: 36px 0 22px;
    border-bottom: 1px solid var(--border-strong);
    margin-bottom: 28px;
  }
  .masthead__eyebrow {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 10px;
  }
  .masthead__title {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-size: clamp(2.4rem, 6vw, 3.4rem);
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }
  .masthead__sub {
    margin: 10px 0 0;
    max-width: 46ch;
    color: var(--text-secondary);
    font-size: 0.95rem;
  }
  .masthead__meta {
    text-align: right;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    color: var(--text-secondary);
    font-size: 0.8125rem;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }
  .masthead__clock {
    font-size: 1.1rem;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }
  .masthead__meta .dim { color: var(--text-muted); }

  .lang-toggle {
    display: inline-flex;
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    overflow: hidden;
  }
  .lang-btn {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    background: var(--surface);
    color: var(--text-secondary);
    border: none;
    padding: 5px 11px;
    cursor: pointer;
  }
  .lang-btn + .lang-btn { border-left: 1px solid var(--border-strong); }
  .lang-btn[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
  .lang-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* ---------- Section labels ---------- */
  .section-label {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 0 0 16px;
    flex-wrap: wrap;
  }
  .section-label__num {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-size: 0.75rem;
    color: var(--text-muted);
    letter-spacing: 0.08em;
  }
  .section-label h2 {
    font-size: 1.05rem;
    margin: 0;
    font-weight: 700;
  }
  .section-label__note {
    margin-left: auto;
    font-size: 0.75rem;
    color: var(--text-muted);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  section.block { margin-bottom: 46px; }

  /* ---------- KPI strip ---------- */
  .kpi-strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .kpi-tile {
    background: var(--surface);
    padding: 18px 20px;
  }
  .kpi-tile__value {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-size: 2rem;
    font-weight: 600;
    color: var(--accent-text);
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .kpi-tile__label {
    margin-top: 6px;
    font-size: 0.8125rem;
    color: var(--text-secondary);
    max-width: 26ch;
  }
  .sources-line {
    margin-top: 10px;
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  /* ---------- Market panel ---------- */
  .market-panel {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 32px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
  }
  .donut-wrap { display: flex; justify-content: center; }
  .legend-table { width: 100%; border-collapse: collapse; }
  .legend-table td { padding: 7px 6px; font-size: 0.85rem; border-bottom: 1px solid var(--border); }
  .legend-table tr:last-child td { border-bottom: none; }
  .legend-swatch { display:inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 8px; vertical-align: -1px; }
  .legend-name { color: var(--text-primary); }
  .legend-share { text-align: right; font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .legend-stations { text-align: right; color: var(--text-muted); font-size: 0.78rem; font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace; }

  @media (max-width: 640px) {
    .market-panel { grid-template-columns: 1fr; }
  }

  /* ---------- Simulation banner ---------- */
  .sim-banner {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    background: var(--accent-soft);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 22px;
  }
  .sim-banner__badge {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    background: var(--accent);
    color: var(--surface);
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
    margin-top: 2px;
  }
  .sim-banner p { margin: 0; font-size: 0.85rem; color: var(--text-secondary); }
  .sim-banner strong { color: var(--text-primary); }

  /* ---------- Filter bar ---------- */
  .filter-bar {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 18px;
  }
  .filter-field { display: flex; align-items: center; gap: 8px; }
  .filter-field label {
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
  }
  .filter-field select {
    appearance: none;
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    color: var(--text-primary);
    font: inherit;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-size: 0.82rem;
    padding: 6px 28px 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 14px) center, calc(100% - 9px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    color: var(--text-primary);
  }
  .filter-field select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .filter-count {
    margin-left: auto;
    font-size: 0.76rem;
    color: var(--text-muted);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
  }

  /* ---------- Network grid ---------- */
  .network-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
  }
  .station-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    box-shadow: var(--shadow-card);
  }
  .station-card__head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2px;
  }
  .station-code {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-size: 0.78rem;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }
  .station-card__location { font-size: 0.9rem; font-weight: 600; margin-bottom: 12px; }
  .station-card__location .dim { font-weight: 400; color: var(--text-muted); font-size: 0.8rem; }

  .station-card__body { display: flex; gap: 16px; }

  .tank { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: none; }
  .tank__tube {
    position: relative;
    width: 30px;
    height: 108px;
    border-radius: 15px;
    border: 2px solid var(--border-strong);
    background: var(--surface-2);
    overflow: hidden;
  }
  .tank__fill {
    position: absolute;
    left: -2px; right: -2px; bottom: -2px;
    border-radius: 13px;
    height: 0%;
  }
  .tank__fill::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: rgba(255,255,255,0.35);
  }
  @media (prefers-reduced-motion: no-preference) {
    .tank__fill { transition: height 0.9s ease, background-color 0.4s ease; }
  }
  .tank__mark {
    position: absolute;
    left: 3px; right: 3px;
    bottom: 50%;
    border-top: 1px dashed var(--border-strong);
    height: 0;
  }
  .tank__value {
    font-size: 0.92rem;
    font-weight: 600;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 4px 8px 4px 6px;
    border-radius: 20px;
    border: 1px solid var(--border);
    flex: none;
  }
  .status-pill__dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .status-pill--good { color: var(--good); background: color-mix(in srgb, var(--good) 10%, transparent); }
  .status-pill--good .status-pill__dot { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 18%, transparent); }
  .status-pill--warning { color: var(--warning); background: color-mix(in srgb, var(--warning-dot) 14%, transparent); }
  .status-pill--warning .status-pill__dot { background: var(--warning-dot); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warning-dot) 20%, transparent); }
  .status-pill--critical { color: var(--critical); background: color-mix(in srgb, var(--critical) 12%, transparent); }
  .status-pill--critical .status-pill__dot { background: var(--critical); box-shadow: 0 0 0 3px color-mix(in srgb, var(--critical) 20%, transparent); }

  .station-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; margin: 0; font-size: 0.76rem; align-content: start; flex: 1; }
  .station-stats dt { color: var(--text-muted); margin: 0 0 2px; }
  .station-stats dd { margin: 0; font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; color: var(--text-primary); font-size: 0.82rem; }

  .no-results { padding: 30px; text-align: center; color: var(--text-muted); border: 1px dashed var(--border-strong); border-radius: 10px; grid-column: 1 / -1; font-size: 0.85rem; }

  /* ---------- Priority queue ---------- */
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  table.priority { width: 100%; border-collapse: collapse; min-width: 640px; }
  table.priority th {
    text-align: left;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
    font-weight: 600;
  }
  table.priority td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
  }
  table.priority tr:last-child td { border-bottom: none; }
  table.priority td.num { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .rank { color: var(--text-muted); font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace; }
  .action-badge {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 4px 8px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .action-badge--dispatch { background: color-mix(in srgb, var(--critical) 14%, transparent); color: var(--critical); }
  .action-badge--schedule { background: color-mix(in srgb, var(--warning-dot) 16%, transparent); color: var(--warning); }
  .action-badge--monitor { background: color-mix(in srgb, var(--good) 12%, transparent); color: var(--good); }

  /* ---------- Pitch panel ---------- */
  .pitch-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 28px;
  }
  .pitch-panel h3 { margin: 0 0 10px; font-size: 1.05rem; }
  .pitch-panel p { color: var(--text-secondary); margin: 0 0 12px; max-width: 68ch; }
  .pitch-panel ul { margin: 0; padding-left: 1.1em; color: var(--text-secondary); }
  .pitch-panel li { margin-bottom: 6px; }

  /* ---------- Footer / signature ---------- */
  .signoff {
    margin-top: 54px;
    padding-top: 24px;
    border-top: 1px solid var(--border-strong);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 24px;
    font-size: 0.82rem;
    color: var(--text-secondary);
  }
  .signoff__name { color: var(--text-primary); font-weight: 700; font-size: 0.95rem; }
  .signoff__cred { margin-top: 4px; line-height: 1.6; max-width: 44ch; }
  .signoff__contact { text-align: right; font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace; font-size: 0.78rem; line-height: 1.9; }
  .signoff__contact a { color: var(--text-secondary); text-decoration: none; }
  .signoff__contact a:hover { color: var(--accent-text); }
  .disclaimer {
    margin-top: 20px;
    font-size: 0.72rem;
    color: var(--text-muted);
    max-width: 80ch;
  }
</style>

<div class="app">

  <header class="masthead">
    <div>
      <p class="masthead__eyebrow" data-i18n="eyebrow"></p>
      <h1 class="masthead__title">VIGIA</h1>
      <p class="masthead__sub" data-i18n="subtitle"></p>
    </div>
    <div class="masthead__meta">
      <div class="lang-toggle" role="group" aria-label="Language / Idioma">
        <button type="button" class="lang-btn" id="langPt" data-lang="pt">PT</button>
        <button type="button" class="lang-btn" id="langEn" data-lang="en">EN</button>
      </div>
      <div>
        <div class="masthead__clock mono" id="clock">--:--:--</div>
        <div id="clockDate" class="dim">Luanda</div>
      </div>
    </div>
  </header>

  <section class="block">
    <div class="section-label">
      <span class="section-label__num">01</span>
      <h2 data-i18n="section1Title"></h2>
      <span class="section-label__note" data-i18n="section1Note"></span>
    </div>
    <div class="kpi-strip">
      <div class="kpi-tile">
        <div class="kpi-tile__value">#2</div>
        <div class="kpi-tile__label" data-i18n="kpi1Label"></div>
      </div>
      <div class="kpi-tile">
        <div class="kpi-tile__value">56%</div>
        <div class="kpi-tile__label" data-i18n="kpi2Label"></div>
      </div>
      <div class="kpi-tile">
        <div class="kpi-tile__value">44%</div>
        <div class="kpi-tile__label" data-i18n="kpi3Label"></div>
      </div>
      <div class="kpi-tile">
        <div class="kpi-tile__value">+31%</div>
        <div class="kpi-tile__label" data-i18n="kpi4Label"></div>
      </div>
    </div>
    <div class="sources-line" id="sourcesLine"></div>
  </section>

  <section class="block">
    <div class="section-label">
      <span class="section-label__num">02</span>
      <h2 data-i18n="section2Title"></h2>
      <span class="section-label__note" data-i18n="section2Note"></span>
    </div>
    <div class="market-panel">
      <div class="donut-wrap">
        <svg width="180" height="180" viewBox="0 0 180 180" id="donut" role="img" aria-label="Market share by distributor"></svg>
      </div>
      <table class="legend-table" id="legendTable"></table>
    </div>
  </section>

  <section class="block">
    <div class="section-label">
      <span class="section-label__num">03</span>
      <h2 data-i18n="section3Title"></h2>
      <span class="section-label__note" data-i18n="section3Note"></span>
    </div>

    <div class="sim-banner">
      <span class="sim-banner__badge" data-i18n="simBadge"></span>
      <p id="simText"></p>
    </div>

    <div class="filter-bar">
      <div class="filter-field">
        <label for="provinceSelect" data-i18n="filterProvinceLabel"></label>
        <select id="provinceSelect"></select>
      </div>
      <div class="filter-field">
        <label for="municipioSelect" data-i18n="filterMunicipioLabel"></label>
        <select id="municipioSelect"></select>
      </div>
      <span class="filter-count" id="filterCount"></span>
    </div>

    <div class="network-grid" id="networkGrid"></div>
  </section>

  <section class="block">
    <div class="section-label">
      <span class="section-label__num">04</span>
      <h2 data-i18n="section4Title"></h2>
      <span class="section-label__note" data-i18n="section4Note"></span>
    </div>
    <div class="table-wrap">
      <table class="priority">
        <thead>
          <tr>
            <th data-i18n="thRank"></th>
            <th data-i18n="thStation"></th>
            <th data-i18n="thMunicipio"></th>
            <th data-i18n="thEta"></th>
            <th data-i18n="thRisk"></th>
            <th data-i18n="thAction"></th>
          </tr>
        </thead>
        <tbody id="priorityBody"></tbody>
      </table>
    </div>
  </section>

  <section class="block pitch-panel">
    <div class="section-label" style="margin-bottom:14px;">
      <span class="section-label__num">05</span>
      <h2 data-i18n="section5Title"></h2>
    </div>
    <p id="pitchP1"></p>

</div>

<script>
(function () {
  "use strict";
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- seeded RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(19790821);

  // ---------- i18n ----------
  var i18n = {
    pt: {
      eyebrow: "Inteligência Operacional — Versão de Demonstração",
      subtitle: "Visibilidade em tempo real sobre os níveis de stock e o risco de rutura na rede de combustíveis — construído para mostrar o que uma parceria com um distribuidor poderia potenciar em toda a rede retalhista de Angola.",
      section1Title: "O mercado de combustíveis a jusante de Angola",
      section1Note: "Fontes · Dados públicos",
      kpi1Label: "Maior produtor de petróleo bruto de África — mas importador líquido de combustível refinado, devido à capacidade limitada de refinação nacional¹",
      kpi2Label: "Dos postos de venda pertencem a apenas quatro redes de distribuidores²",
      kpi3Label: 'Dos postos são operadores independentes "Bandeira Branca", fora de qualquer distribuidor²',
      kpi4Label: "Crescimento previsto da procura de GPL em Angola até 2027³",
      sourcesLine: "¹ Angola Petroleum — Visão Geral do Downstream &nbsp;·&nbsp; ² S&amp;P Global, Angola Fuel Retail &nbsp;·&nbsp; ³ Energy Capital &amp; Power, cobertura de investimento downstream em Angola",
      section2Title: "Rede de retalho por distribuidor",
      section2Note: "526 postos",
      donutStations: "postos",
      section3Title: "Simulação da rede em tempo real",
      section3Note: "A atualizar",
      simBadge: "SIMULADO",
      simText: '<strong>Os dados ao nível dos postos abaixo são sintéticos</strong>, gerados para demonstrar o motor analítico — capacidades, taxas de consumo e previsão de rutura são modelados, não medidos. As secções 01–02 acima são dados reais, com fontes. Ligado a telemetria real dos tanques, isto torna-se um fluxo operacional ao vivo — ver secção 05.',
      filterProvinceLabel: "Província",
      filterMunicipioLabel: "Município",
      filterAllProvinces: "Todas as províncias",
      filterAllMunicipios: "Todos os municípios",
      filterCount: function (n, total) { return n + " de " + total + " postos"; },
      statVolume: "Volume estimado",
      statDrawdown: "Consumo",
      statEta: "Tempo até esgotar",
      statRisk: "Risco de rutura (24h)",
      statusReady: "PRONTO",
      statusLow: "BAIXO",
      statusCritical: "CRÍTICO",
      section4Title: "Fila de reabastecimento prioritário",
      section4Note: "Dentro da seleção atual",
      thRank: "Posição",
      thStation: "Posto",
      thMunicipio: "Município",
      thEta: "Tempo até esgotar",
      thRisk: "Risco de rutura (24h)",
      thAction: "Ação",
      actionDispatch: "DESPACHAR AGORA",
      actionSchedule: "AGENDAR",
      actionMonitor: "MONITORIZAR",
      noResults: "Nenhum posto nesta seleção.",
      etaPlus: "96h+",
      etaPrefix: "~",
      section5Title: "O que isto se torna com telemetria real",
      pitchP1: "Esta versão funciona inteiramente com estatísticas públicas nacionais e uma simulação sintética de postos — não foram usados nem solicitados dados de qualquer distribuidor para a produzir. Existe para mostrar o motor, não para reivindicar um acesso que não tem.",
      pitchP2: "Ligado a dados reais, a mesma arquitetura torna-se uma ferramenta operacional em vez de uma demonstração:",
      pitchLi1: "<strong>Fluxo de nível de tanque</strong> — a partir de sensores automáticos já existentes, ou de retrofits de baixo custo (ultrassónicos/boia) onde não existem.",
      pitchLi2: "<strong>Modelação preditiva de rutura</strong> — treinada com histórico real de consumo e entregas, em vez de uma taxa sintética.",
      pitchLi3: "<strong>Priorização de entregas</strong> — uma fila de despacho real e classificada, em vez da ilustrativa na secção 04.",
      pitchLi4: '<strong>Visibilidade para o condutor</strong> — os mesmos dados, mostrados aos condutores, reduzem a "procura de posto em posto" que custa tráfego e combustível a cada estação.',
      signoffCred: "Cientista de Dados · Mestrado em Ciência de Dados, Worcester Polytechnic Institute (prev. 2026) · Bolseiro Fulbright 2024–2026 · IEEE HealthCom 2026 (revisto por pares) · Harvard Health System Innovation Lab, Colaborador de Investigação",
      disclaimer: 'O Vigia é um protótipo independente de prova de capacidade, preparado por Aires Miguêns, sem afiliação ou aprovação da Sonangol, Pumangol, Galp/Sonangalp ou TotalEnergies, e não construído com dados destas empresas. Os valores de quota de mercado na secção 02 provêm de fontes públicas de terceiros (S&amp;P Global, Angola Petroleum); os dados ao nível dos postos nas secções 03–04 são sintéticos e apenas ilustrativos.',
      marketNames: ["Bandeira Branca (independente)", "Sonangol Distribuidora", "Pumangol", "Sonangalp (Galp)", "Tomsa (TotalEnergies)"]
    },
    en: {
      eyebrow: "Operational Intelligence — Demonstration Build",
      subtitle: "Live visibility into fuel-network stock levels and stockout risk — built to show what a distributor partnership could power across Angola's retail network.",
      section1Title: "Angola's downstream fuel market",
      section1Note: "Sourced · Public data",
      kpi1Label: "Crude producer in Africa — yet a net importer of refined fuel, due to limited domestic refining capacity¹",
      kpi2Label: "Of retail stations sit inside just four distributor networks²",
      kpi3Label: 'Of stations are independent "Bandeira Branca" operators, outside any single distributor²',
      kpi4Label: "Projected growth in Angola's LPG demand by 2027³",
      sourcesLine: "¹ Angola Petroleum — Downstream Overview &nbsp;·&nbsp; ² S&amp;P Global, Angola Fuel Retail &nbsp;·&nbsp; ³ Energy Capital &amp; Power, Angola downstream investment coverage",
      section2Title: "Retail network by distributor",
      section2Note: "526 stations",
      donutStations: "stations",
      section3Title: "Live network simulation",
      section3Note: "Updating",
      simBadge: "SIMULATED",
      simText: '<strong>Station-level tank data below is synthetic</strong>, generated to demonstrate the analytics engine — capacities, draw-down rates and stockout timing are modeled, not measured. Sections 01–02 above are real, sourced figures. Connected to actual tank telemetry, this becomes a live operational feed — see section 05.',
      filterProvinceLabel: "Province",
      filterMunicipioLabel: "Municipality",
      filterAllProvinces: "All provinces",
      filterAllMunicipios: "All municipalities",
      filterCount: function (n, total) { return n + " of " + total + " stations"; },
      statVolume: "Est. volume",
      statDrawdown: "Draw-down",
      statEta: "Time to empty",
      statRisk: "Stockout risk (24h)",
      statusReady: "READY",
      statusLow: "LOW",
      statusCritical: "CRITICAL",
      section4Title: "Priority resupply queue",
      section4Note: "Within current selection",
      thRank: "Rank",
      thStation: "Station",
      thMunicipio: "Municipality",
      thEta: "Time to empty",
      thRisk: "Stockout risk (24h)",
      thAction: "Action",
      actionDispatch: "DISPATCH NOW",
      actionSchedule: "SCHEDULE",
      actionMonitor: "MONITOR",
      noResults: "No stations in this selection.",
      etaPlus: "96h+",
      etaPrefix: "~",
      section5Title: "What this becomes with real telemetry",
      pitchP1: "This build runs entirely on public national statistics and a synthetic station simulation — no distributor data was used or requested to produce it. It exists to show the engine, not to claim access it doesn't have.",
      pitchP2: "Connected to real inputs, the same architecture becomes an operational tool rather than a demonstration:",
      pitchLi1: "<strong>Tank-level feed</strong> — from existing automated gauges where installed, or low-cost ultrasonic/float retrofits where they aren't.",
      pitchLi2: "<strong>Predictive stockout modeling</strong> — trained on real draw-down and delivery history instead of a synthetic rate.",
      pitchLi3: "<strong>Delivery prioritization</strong> — a live, ranked dispatch queue instead of the illustrative one in section 04.",
      pitchLi4: '<strong>Consumer-facing visibility</strong> — the same data, surfaced to drivers, reduces the "station-hopping" congestion that costs every station foot traffic and fuel.',
      signoffCred: "Data Scientist · MSc Data Science, Worcester Polytechnic Institute (exp. 2026) · Fulbright Scholar 2024–2026 · IEEE HealthCom 2026 (peer-reviewed) · Harvard Health System Innovation Lab, Research Collaborator",
      disclaimer: 'Vigia is an independent proof-of-capability prototype prepared by Aires Miguêns and is not affiliated with, endorsed by, or built using data from Sonangol, Pumangol, Galp/Sonangalp or TotalEnergies. Market-share figures in section 02 are drawn from published third-party reporting (S&amp;P Global, Angola Petroleum); station-level data in sections 03–04 is synthetic and illustrative only.',
      marketNames: ["Bandeira Branca (independent)", "Sonangol Distribuidora", "Pumangol", "Sonangalp (Galp)", "Tomsa (TotalEnergies)"]
    }
  };
  var currentLang = "pt";
  function t(key) { return i18n[currentLang][key]; }

  // ---------- clock ----------
  var clockEl = document.getElementById("clock");
  var clockDateEl = document.getElementById("clockDate");
  function tickClock() {
    var now = new Date();
    var locale = currentLang === "pt" ? "pt-PT" : "en-GB";
    var timeFmt = new Intl.DateTimeFormat(locale, { hour: "2-digit", minute: "2-digit", second: "2-digit", timeZone: "Africa/Luanda", hour12: false });
    var dateFmt = new Intl.DateTimeFormat(locale, { day: "2-digit", month: "short", year: "numeric", timeZone: "Africa/Luanda" });
    clockEl.textContent = timeFmt.format(now);
    clockDateEl.textContent = "Luanda · " + dateFmt.format(now);
  }
  tickClock();
  setInterval(tickClock, 1000);

  // ---------- market share (real, sourced) ----------
  var marketBase = [
    { share: 44, stations: 393, color: "var(--cat-1)" },
    { share: 36, stations: 326, color: "var(--cat-2)" },
    { share: 9, stations: 78, color: "var(--cat-3)" },
    { share: 7, stations: 60, color: "var(--cat-4)" },
    { share: 4, stations: 41, color: "var(--cat-5)" }
  ];

  var donutSvg = document.getElementById("donut");
  var legendTableEl = document.getElementById("legendTable");
  var ns = "http://www.w3.org/2000/svg";

  function renderDonut() {
    donutSvg.innerHTML = "";
    var cx = 90, cy = 90, r = 68, sw = 24;
    var circumference = 2 * Math.PI * r;
    var offset = 0;
    var names = t("marketNames");
    marketBase.forEach(function (m, idx) {
      var len = (m.share / 100) * circumference;
      var gap = 2;
      var circle = document.createElementNS(ns, "circle");
      circle.setAttribute("cx", cx);
      circle.setAttribute("cy", cy);
      circle.setAttribute("r", r);
      circle.setAttribute("fill", "none");
      circle.setAttribute("stroke", m.color);
      circle.setAttribute("stroke-width", sw);
      circle.setAttribute("stroke-dasharray", Math.max(len - gap, 1) + " " + (circumference - len + gap));
      circle.setAttribute("stroke-dashoffset", -offset);
      circle.setAttribute("transform", "rotate(-90 " + cx + " " + cy + ")");
      var title = document.createElementNS(ns, "title");
      title.textContent = names[idx] + " — " + m.share + "% (" + m.stations + (currentLang === "pt" ? " postos)" : " stations)");
      circle.appendChild(title);
      donutSvg.appendChild(circle);
      offset += len;
    });
    var centerText = document.createElementNS(ns, "text");
    centerText.setAttribute("x", cx);
    centerText.setAttribute("y", cy - 4);
    centerText.setAttribute("text-anchor", "middle");
    centerText.setAttribute("class", "mono");
    centerText.setAttribute("font-size", "22");
    centerText.setAttribute("font-weight", "600");
    centerText.setAttribute("fill", "currentColor");
    centerText.textContent = "526";
    donutSvg.appendChild(centerText);
    var centerSub = document.createElementNS(ns, "text");
    centerSub.setAttribute("x", cx);
    centerSub.setAttribute("y", cy + 14);
    centerSub.setAttribute("text-anchor", "middle");
    centerSub.setAttribute("font-size", "10");
    centerSub.setAttribute("fill", "currentColor");
    centerSub.setAttribute("opacity", "0.55");
    centerSub.textContent = t("donutStations");
    donutSvg.appendChild(centerSub);
  }

  function renderLegend() {
    legendTableEl.innerHTML = "";
    var names = t("marketNames");
    marketBase.forEach(function (m, idx) {
      var tr = document.createElement("tr");
      tr.innerHTML =
        '<td><span class="legend-swatch" style="background:' + m.color + '"></span><span class="legend-name">' + names[idx] + '</span></td>' +
        '<td class="legend-share">' + m.share + '%</td>' +
        '<td class="legend-stations">' + m.stations + ' ' + t("donutStations") + '</td>';
      legendTableEl.appendChild(tr);
    });
  }

  // ---------- simulated station network (real provinces/municípios) ----------
  var geography = {
    "Luanda": ["Kilamba Kiaxi", "Talatona", "Viana", "Ingombota", "Maianga", "Cazenga", "Rangel", "Cacuaco", "Belas", "Sambizanga"],
    "Benguela": ["Benguela", "Lobito", "Baía Farta", "Catumbela"],
    "Huíla": ["Lubango", "Matala", "Humpata"],
    "Huambo": ["Huambo", "Caála", "Bailundo"]
  };

  var stations = [];
  Object.keys(geography).forEach(function (province) {
    geography[province].forEach(function (municipio) {
      var idx = stations.length;
      var capacity = Math.round((22000 + rng() * 20000) / 500) * 500;
      var pct = 0.08 + rng() * 0.9;
      var rate = Math.round(280 + rng() * 620);
      stations.push({
        code: "PST-" + String(idx + 1).padStart(2, "0"),
        province: province,
        district: municipio,
        capacity: capacity,
        level: capacity * pct,
        rate: rate
      });
    });
  });
  function forceState(district, pctOfCap, rate) {
    var s = stations.find(function (x) { return x.district === district; });
    if (s) { s.level = s.capacity * pctOfCap; if (rate) s.rate = rate; }
  }
  forceState("Viana", 0.09, 540);
  forceState("Cazenga", 0.03, 668);
  forceState("Rangel", 0.30);
  forceState("Cacuaco", 0.35);
  forceState("Sambizanga", 0.20);
  forceState("Lobito", 0.07, 610);
  forceState("Matala", 0.28);
  forceState("Caála", 0.11, 470);

  var gridEl = document.getElementById("networkGrid");
  var priorityBody = document.getElementById("priorityBody");
  var provinceSelect = document.getElementById("provinceSelect");
  var municipioSelect = document.getElementById("municipioSelect");
  var filterCountEl = document.getElementById("filterCount");

  function populateProvinces() {
    var current = provinceSelect.value || "all";
    var opts = ['<option value="all">' + t("filterAllProvinces") + '</option>'];
    Object.keys(geography).forEach(function (p) {
      opts.push('<option value="' + p + '">' + p + '</option>');
    });
    provinceSelect.innerHTML = opts.join("");
    provinceSelect.value = current;
    if (provinceSelect.selectedIndex < 0) provinceSelect.value = "all";
  }
  function populateMunicipios(province) {
    var current = municipioSelect.value || "all";
    var opts = ['<option value="all">' + t("filterAllMunicipios") + '</option>'];
    var list = province === "all"
      ? Object.keys(geography).reduce(function (acc, p) { return acc.concat(geography[p]); }, [])
      : geography[province] || [];
    list.forEach(function (m) { opts.push('<option value="' + m + '">' + m + '</option>'); });
    municipioSelect.innerHTML = opts.join("");
    municipioSelect.value = current;
    if (municipioSelect.selectedIndex < 0) municipioSelect.value = "all";
  }

  function currentFilter() {
    return { province: provinceSelect.value, municipio: municipioSelect.value };
  }
  function filteredStations() {
    var f = currentFilter();
    return stations.filter(function (s) {
      return (f.province === "all" || s.province === f.province) &&
             (f.municipio === "all" || s.district === f.municipio);
    });
  }

  function statusFor(pct) {
    if (pct <= 0.15) return { key: "critical", label: t("statusCritical") };
    if (pct <= 0.4) return { key: "warning", label: t("statusLow") };
    return { key: "good", label: t("statusReady") };
  }
  function hoursToEmpty(s) {
    return s.rate > 0 ? s.level / s.rate : 999;
  }
  function riskPct(hrs) {
    return Math.max(3, Math.min(97, Math.round(100 - (hrs / 30) * 100)));
  }
  function fmtEta(hrs) {
    return hrs > 96 ? t("etaPlus") : t("etaPrefix") + Math.round(hrs) + "h";
  }

  function buildCard(s) {
    var i = stations.indexOf(s);
    var card = document.createElement("article");
    card.className = "station-card";

    var head = document.createElement("div");
    head.className = "station-card__head";
    head.innerHTML = '<span class="station-code">' + s.code + '</span>' +
      '<span class="status-pill" id="pill-' + i + '"><span class="status-pill__dot"></span><span class="status-pill__label"></span></span>';
    card.appendChild(head);

    var loc = document.createElement("div");
    loc.className = "station-card__location";
    loc.innerHTML = s.district + ' <span class="dim">· ' + s.province + '</span>';
    card.appendChild(loc);

    var body = document.createElement("div");
    body.className = "station-card__body";
    body.innerHTML =
      '<div class="tank">' +
        '<div class="tank__tube"><div class="tank__mark"></div><div class="tank__fill" id="fill-' + i + '"></div></div>' +
        '<div class="tank__value mono" id="val-' + i + '">0%</div>' +
      '</div>' +
      '<dl class="station-stats">' +
        '<div><dt>' + t("statVolume") + '</dt><dd id="vol-' + i + '"></dd></div>' +
        '<div><dt>' + t("statDrawdown") + '</dt><dd>' + s.rate.toLocaleString() + ' L/h</dd></div>' +
        '<div><dt>' + t("statEta") + '</dt><dd id="eta-' + i + '"></dd></div>' +
        '<div><dt>' + t("statRisk") + '</dt><dd id="risk-' + i + '"></dd></div>' +
      '</dl>';
    card.appendChild(body);
    return card;
  }

  function renderGrid() {
    var visible = filteredStations();
    gridEl.innerHTML = "";
    if (!visible.length) {
      var empty = document.createElement("div");
      empty.className = "no-results";
      empty.textContent = t("noResults");
      gridEl.appendChild(empty);
    } else {
      visible.forEach(function (s) { gridEl.appendChild(buildCard(s)); });
    }
    filterCountEl.textContent = t("filterCount")(visible.length, stations.length);
    updateValues();
  }

  function updateValues() {
    stations.forEach(function (s, i) {
      var fillEl = document.getElementById("fill-" + i);
      if (!fillEl) return; // not currently rendered (filtered out)
      var pct = Math.max(0, Math.min(1, s.level / s.capacity));
      var st = statusFor(pct);
      var color = st.key === "good" ? "var(--good)" : st.key === "warning" ? "var(--warning-dot)" : "var(--critical)";
      fillEl.style.height = (pct * 100).toFixed(1) + "%";
      fillEl.style.background = color;

      document.getElementById("val-" + i).textContent = Math.round(pct * 100) + "%";

      var pill = document.getElementById("pill-" + i);
      pill.className = "status-pill status-pill--" + st.key;
      pill.querySelector(".status-pill__label").textContent = st.label;

      document.getElementById("vol-" + i).textContent = Math.round(s.level).toLocaleString() + " L";
      var hrs = hoursToEmpty(s);
      document.getElementById("eta-" + i).textContent = fmtEta(hrs);
      document.getElementById("risk-" + i).textContent = riskPct(hrs) + "%";
    });
    renderPriority();
  }

  function renderPriority() {
    var ranked = filteredStations().map(function (s) { return { s: s, hrs: hoursToEmpty(s) }; })
      .sort(function (a, b) { return a.hrs - b.hrs; })
      .slice(0, 6);
    priorityBody.innerHTML = "";
    if (!ranked.length) {
      priorityBody.innerHTML = '<tr><td colspan="6" class="no-results" style="border:none;">' + t("noResults") + '</td></tr>';
      return;
    }
    ranked.forEach(function (r, idx) {
      var action = r.hrs < 4 ? { cls: "dispatch", label: t("actionDispatch") } : r.hrs < 12 ? { cls: "schedule", label: t("actionSchedule") } : { cls: "monitor", label: t("actionMonitor") };
      var tr = document.createElement("tr");
      tr.innerHTML =
        '<td class="rank">' + (idx + 1) + '</td>' +
        '<td>' + r.s.code + '</td>' +
        '<td>' + r.s.district + '</td>' +
        '<td class="num">' + fmtEta(r.hrs) + '</td>' +
        '<td class="num">' + riskPct(r.hrs) + '%</td>' +
        '<td><span class="action-badge action-badge--' + action.cls + '">' + action.label + '</span></td>';
      priorityBody.appendChild(tr);
    });
  }

  // ---------- static text application ----------
  function applyStaticText() {
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var key = el.getAttribute("data-i18n");
      el.textContent = t(key);
    });
    document.getElementById("sourcesLine").innerHTML = t("sourcesLine");
    document.getElementById("simText").innerHTML = t("simText");
    document.getElementById("pitchP1").textContent = t("pitchP1");
    document.getElementById("pitchP2").textContent = t("pitchP2");
    document.getElementById("pitchLi1").innerHTML = t("pitchLi1");
    document.getElementById("pitchLi2").innerHTML = t("pitchLi2");
    document.getElementById("pitchLi3").innerHTML = t("pitchLi3");
    document.getElementById("pitchLi4").innerHTML = t("pitchLi4");
    document.getElementById("signoffCred").textContent = t("signoffCred");
    document.getElementById("disclaimer").innerHTML = t("disclaimer");
    document.documentElement.lang = currentLang;
  }

  function setLang(lang) {
    currentLang = lang;
    document.getElementById("langPt").setAttribute("aria-pressed", lang === "pt" ? "true" : "false");
    document.getElementById("langEn").setAttribute("aria-pressed", lang === "en" ? "true" : "false");
    applyStaticText();
    populateProvinces();
    populateMunicipios(provinceSelect.value);
    renderDonut();
    renderLegend();
    renderGrid();
    tickClock();
  }

  document.getElementById("langPt").addEventListener("click", function () { setLang("pt"); });
  document.getElementById("langEn").addEventListener("click", function () { setLang("en"); });

  provinceSelect.addEventListener("change", function () {
    populateMunicipios(provinceSelect.value);
    renderGrid();
  });
  municipioSelect.addEventListener("change", renderGrid);

  setLang("pt");

  var tickMs = reduceMotion ? 4000 : 1800;
  setInterval(function () {
    stations.forEach(function (s) {
      var jitter = 0.6 + rng() * 0.8;
      s.level -= (s.rate / 3600) * (tickMs / 1000) * 90 * jitter;
      if (s.level <= 0) {
        s.level = s.capacity; // simulated resupply
      }
    });
    updateValues();
  }, tickMs);
})();
</script>
