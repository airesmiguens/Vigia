<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigia · Telemetria remota de tanques</title>
<style>
  :root {
    --bg: #0F1513;
    --bar: #151D1A;
    --line: #2A3632;
    --text: #E7EEEB;
    --muted: #8E9C97;
    --accent: #9085e9;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; }
  header, footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; background: var(--bar); border-color: var(--line); border-style: solid; border-width: 0; flex-wrap: wrap; }
  header { border-bottom-width: 1px; }
  footer { border-top-width: 1px; justify-content: center; }
  .title { font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .title strong { color: var(--text); font-weight: 700; }
  a { color: var(--text); }
  .btn { font-family: var(--mono); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: 0.35; cursor: default; border-color: var(--line); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px; position: relative; }
  main img { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; object-fit: contain; border-radius: 6px; box-shadow: 0 8px 40px rgba(0,0,0,0.45); background: #fff; user-select: none; }
  .counter { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); min-width: 7ch; text-align: center; font-variant-numeric: tabular-nums; }
  .nav { display: flex; align-items: center; gap: 14px; }
  .hint { font-size: 0.75rem; color: var(--muted); }
  :fullscreen header, :fullscreen footer { display: none; }
  :fullscreen main { padding: 0; background: #000; }
  :fullscreen main img { border-radius: 0; box-shadow: none; }
  @media (max-width: 600px) { .hint { display: none; } }
</style>
</head>
<body>
  <header>
    <span class="title"><strong>Vigia</strong> · Telemetria remota de tanques</span>
    <div class="actions">
      <a class="btn" href="../index.html">← Voltar ao site</a>
      <button class="btn" id="fs" type="button">Ecrã inteiro</button>
    </div>
  </header>
  <main id="stage">
    <img id="slide" src="slides/slide-01.jpg" alt="Diapositivo 1 de 18">
  </main>
  <footer>
    <div class="nav">
      <button class="btn" id="prev" type="button" aria-label="Diapositivo anterior">← Anterior</button>
      <span class="counter" id="counter" aria-live="polite">1 / 18</span>
      <button class="btn" id="next" type="button" aria-label="Diapositivo seguinte">Seguinte →</button>
    </div>
    <span class="hint">Use as setas do teclado · F para ecrã inteiro</span>
  </footer>
<script>
(function () {
  var TOTAL = 18;
  var img = document.getElementById("slide");
  var counter = document.getElementById("counter");
  var prev = document.getElementById("prev");
  var next = document.getElementById("next");
  var cur = 1;

  function src(n) { return "slides/slide-" + (n < 10 ? "0" : "") + n + ".jpg"; }
  function preload(n) { if (n >= 1 && n <= TOTAL) { var i = new Image(); i.src = src(n); } }

  function show(n) {
    cur = Math.max(1, Math.min(TOTAL, n));
    img.src = src(cur);
    img.alt = "Diapositivo " + cur + " de " + TOTAL;
    counter.textContent = cur + " / " + TOTAL;
    prev.disabled = cur === 1;
    next.disabled = cur === TOTAL;
    if (location.hash !== "#" + cur) history.replaceState(null, "", "#" + cur);
    preload(cur + 1); preload(cur - 1);
  }

  prev.addEventListener("click", function () { show(cur - 1); });
  next.addEventListener("click", function () { show(cur + 1); });
  img.addEventListener("click", function (e) {
    var r = img.getBoundingClientRect();
    show(e.clientX - r.left < r.width / 3 ? cur - 1 : cur + 1);
  });

  function toggleFs() {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen().catch(function () {}); }
  }
  document.getElementById("fs").addEventListener("click", toggleFs);

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); show(cur + 1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); show(cur - 1); }
    else if (e.key === "Home") { show(1); }
    else if (e.key === "End") { show(TOTAL); }
    else if (e.key === "f" || e.key === "F") { toggleFs(); }
  });

  var x0 = null;
  document.getElementById("stage").addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  document.getElementById("stage").addEventListener("touchend", function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) show(dx < 0 ? cur + 1 : cur - 1);
    x0 = null;
  });

  var start = parseInt(location.hash.slice(1), 10);
  show(isNaN(start) ? 1 : start);
})();
</script>
</body>
</html>
